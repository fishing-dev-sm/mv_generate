<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<script src="visual.js"></script>
<script>
/* 引擎 v2：shot-list 驱动。每帧是时间的纯函数 render(t)，只依赖注入的 DATA 和 t。
 * 图层顺序（2026-10-01 起，对齐 Figma《Escape Velocity — Motion Layers》）：
 *   ① 底图 / H3 视频
 *   ② 印刷 pass（半调网点）——全片只此一处，只作用于 ①
 *   ③ 视觉层（chrome 常驻层 → 意义层原子件 → 歌词）——干净渲染，不参与印刷 pass
 *   ④ vignette 收尾
 * 视觉层全部实现在 visual.js，本文件只管底层取帧与印刷 pass。
 */
let DATA = null;
const PLATES = {};
const FRAMES = {};
const BASE = [];        // 「底片模式」：整片只用一条最终底片（out/base-noJS-v2 的帧），
                        // 逐镜不再自带帧——这样视觉层与底片是同一时间轴上的像素级对齐。
const W = 1920, H = 1080;
const cv = document.getElementById("stage");
const ctx = cv.getContext("2d");

/* ---------- EV 式印刷颗粒：彩色半调网点 print pass（WebGL fragment shader）。
 * 亮度→网点覆盖率（暗部大点/亮部小点），RGB 通道错位采样（riso 套印感）。
 * 参数来自 shots.json 顶层 "halftone"。噪点在 GPU hash，无每帧 Math.random。
 * 只跑视频层：视觉层（文字/卡片）不再跑第二遍（2026-10-01 导演裁决）。 ---------- */
let GLC = null;
function initPrintPass() {
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const gl = c.getContext("webgl", { preserveDrawingBuffer: true, alpha: true });
  if (!gl) { console.warn("WebGL unavailable, print pass disabled"); return null; }
  const VS = `attribute vec2 a_pos; varying vec2 v_uv;
    void main(){ v_uv = a_pos*0.5+0.5; gl_Position = vec4(a_pos,0.,1.); }`;
  const FS = `precision highp float;
    varying vec2 v_uv;
    uniform sampler2D u_tex; uniform vec2 u_res;
    uniform float u_cell, u_strength, u_misreg, u_grain, u_seed, u_invert;
    float lum(vec3 c){ return dot(c, vec3(0.299,0.587,0.114)); }
    float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7))+u_seed)*43758.5453123); }
    void main(){
      vec2 frag = v_uv * u_res;
      vec4 src = texture2D(u_tex, v_uv);
      vec3 orig = src.rgb;
      vec2 cell = floor(frag / u_cell);
      vec2 center = (cell + 0.5) * u_cell;
      float maxR = u_cell * 0.52;
      float aa = 0.8;
      vec3 cov, ink;
      for (int i = 0; i < 3; i++) {
        float s = float(i - 1);
        vec2 o = vec2(s * u_misreg, -s * u_misreg * 0.6);
        vec3 c = texture2D(u_tex, (center + o) / u_res).rgb;
        float L = lum(c);
        float base = u_invert > 0.5 ? L : 1.0 - L;
        float r = maxR * pow(clamp(base, 0.0, 1.0), 1.15);
        float d = length(frag - center);
        cov[i] = 1.0 - smoothstep(r - aa, r + aa, d);
        ink[i] = clamp(c[i] / (L + 0.35), 0.0, 1.0);
      }
      vec3 result = mix(orig, ink, cov * u_strength);
      float g = (hash(frag) - 0.5) * u_grain;
      result = (result + vec3(g)) * src.a;
      gl_FragColor = vec4(result, src.a);
    }`;
  function sh(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
      throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
    throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER,
    new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "a_pos");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.viewport(0, 0, W, H);
  return { gl, prog, tex, canvas: c };
}

/* 跑一遍 print pass：把 srcCanvas 处理后画回主 canvas（shader 内已按 strength 混合） */
function printPassFrom(srcCanvas, ht, invert, seed) {
  if (!ht || ht.strength <= 0) return;
  if (!GLC) GLC = initPrintPass();
  if (!GLC) return;
  const gl = GLC.gl, prog = GLC.prog, tex = GLC.tex;
  gl.useProgram(prog);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, srcCanvas);
  const u = n => gl.getUniformLocation(prog, n);
  gl.uniform1i(u("u_tex"), 0);
  gl.uniform2f(u("u_res"), W, H);
  gl.uniform1f(u("u_cell"), ht.cell || 5);
  gl.uniform1f(u("u_strength"), ht.strength);
  gl.uniform1f(u("u_misreg"), ht.misregister || 1);
  gl.uniform1f(u("u_grain"), ht.grain || 0.06);
  gl.uniform1f(u("u_seed"), seed);
  gl.uniform1f(u("u_invert"), invert);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  ctx.drawImage(GLC.canvas, 0, 0);
}

/* 全片唯一一次印刷 pass：只作用于底图 / H3 视频层 */
function printPassVideo(f) {
  printPassFrom(cv, DATA.config.halftone, 0, f * 17.13);
}

function loadImage(url) {
  return new Promise((resolve, reject) => {
    const im = new Image();
    im.onload = () => resolve(im);
    im.onerror = () => reject(new Error("load failed: " + url));
    im.src = url;
  });
}

window.__setData = function (data) {
  DATA = data;
  VISUAL.setup(cv);
  const jobs = [];
  if (data.base && data.base.urls) {
    data.base.urls.forEach((u, i) => jobs.push(
      loadImage(u).then(im => { BASE[i] = im; })));
  }
  for (const s of data.shots) {
    if (data.base) break;                 // 底片模式：镜头帧一律不载（省内存也省时间）
    if (s.type === "plate") {
      jobs.push(loadImage(s.plateUrl).then(im => { PLATES[s.id] = im; }));
    } else if (s.type === "video") {
      FRAMES[s.id] = [];
      s.frameUrls.forEach((u, i) => jobs.push(
        loadImage(u).then(im => { FRAMES[s.id][i] = im; })));
    }
  }
  return Promise.all(jobs).then(() => true);
};

/* ---------- 工具 ---------- */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function activeShot(t) {
  for (const s of DATA.shots) if (t >= s.t0 && t < s.t1) return s;
  return null;
}
function beatPulse(t) {
  const beats = DATA.beats;
  let last = -1e9;
  for (let i = 0; i < beats.length; i++) {
    if (beats[i] <= t) last = beats[i]; else break;
  }
  const dt = t - last;
  if (dt < 0 || dt > 0.6) return 0;
  return Math.exp(-dt * 8);
}
function nextBeatAfter(t) {
  for (const b of DATA.beats) if (b >= t) return b;
  return t;
}
function beatsBetween(t0, t1) {
  let n = 0;
  for (const b of DATA.beats) if (b >= t0 && b < t1) n++;
  return n;
}
/* 重拍冲击（每 4 拍一次）：视频层跟着音乐呼吸，不是死画面 */
function downPulse(t) {
  const beats = DATA.beats;
  let last = -1e9, idx = -1;
  for (let i = 0; i < beats.length; i++) {
    if (beats[i] <= t) { last = beats[i]; idx = i; } else break;
  }
  const dpb = DATA.config.downbeatEvery || 4;
  if (idx < 0 || idx % dpb !== 0) return 0;
  const dt = t - last;
  if (dt < 0 || dt > 0.4) return 0;
  return Math.exp(-dt * 10);
}
/* 底图的 cover-fit 变换（供视觉层把「源片像素坐标」映射到画面坐标） */
let LAST_XF = null;
function drawCoverFit(img, zoom) {
  const iw = img.width, ih = img.height;
  const scale = Math.max(W / iw, H / ih) * zoom;
  const dw = iw * scale, dh = ih * scale;
  const ox = (W - dw) / 2, oy = (H - dh) / 2;
  LAST_XF = { s: scale, ox: ox, oy: oy, iw: iw, ih: ih };
  ctx.drawImage(img, ox, oy, dw, dh);
}
/* DTW timemap 查表：ref_t(u) → clip_t，线性插值（pairs 按 ref_t 升序） */
function timemapLookup(pairs, u) {
  const first = pairs[0], last = pairs[pairs.length - 1];
  if (u <= first[0]) return first[1];
  if (u >= last[0]) return last[1];
  let lo = 0, hi = pairs.length - 1;
  while (hi - lo > 1) {
    const m = (lo + hi) >> 1;
    if (pairs[m][0] <= u) lo = m; else hi = m;
  }
  const r0 = pairs[lo][0], c0 = pairs[lo][1];
  const r1 = pairs[hi][0], c1 = pairs[hi][1];
  return c0 + (c1 - c0) * ((u - r0) / (r1 - r0));
}
/* ---------- 底层（底图 / 视频） ---------- */
function drawBase(shot, t) {
  if (BASE.length) {
    const idx = clamp(Math.round(t * DATA.config.fps) - DATA.base.index0, 0, BASE.length - 1);
    const u = clamp((t - shot.t0) / Math.max(0.001, shot.t1 - shot.t0), 0, 1);
    drawCoverFit(BASE[idx], 1.0 + 0.006 * u + 0.008 * downPulse(t));
    return;
  }
  if (shot.type === "plate") {
    LAST_XF = null;
    const u = Math.min(1, Math.max(0, (t - shot.t0) / (shot.t1 - shot.t0)));
    const pulse = beatPulse(t);
    const zoom = 1.02 + 0.10 * u + 0.02 * pulse;
    const panX = -20 * u, panY = -12 * u;
    const img = PLATES[shot.id];
    const iw = img.width, ih = img.height;
    const scale = Math.max(W / iw, H / ih) * zoom;
    const dw = iw * scale, dh = ih * scale;
    ctx.drawImage(img, (W - dw) / 2 + panX, (H - dh) / 2 + panY, dw, dh);
  } else {
    const u = t - shot.t0;
    let clipT;
    if (shot.timemapPairs) clipT = timemapLookup(shot.timemapPairs, u);
    else clipT = u + (shot.frameOffset || 0);
    const idx = Math.min(FRAMES[shot.id].length - 1,
      Math.max(0, Math.round(clipT * 24)));
    const img = FRAMES[shot.id][idx];
    const uu = Math.min(1, Math.max(0, u / (shot.t1 - shot.t0)));
    if (img) drawCoverFit(img, 1.0 + 0.015 * uu + 0.012 * downPulse(t));
  }
}
function drawVignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.42, W / 2, H / 2, H * 0.95);
  g.addColorStop(0, "rgba(0,0,0,0)");
  g.addColorStop(1, "rgba(0,0,0,0.22)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

window.render = function (t) {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);
  if (!DATA) return;
  const f = Math.round((t - DATA.config.t0) * DATA.config.fps);
  const shot = activeShot(t);
  if (!shot) { drawVignette(); return; }
  // ① 底图 / 视频
  drawBase(shot, t);
  // ② 印刷 pass（全片唯一一次，只作用于底层）
  printPassVideo(f);
  // ③ 视觉层：chrome → 意义层 → 歌词（visual.js，干净渲染）
  VISUAL.render(ctx, {
    t: t,
    t0: DATA.config.t0,
    xf: LAST_XF,
    shot: shot,
    shots: DATA.shots,
    shotIndex: DATA.shots.indexOf(shot),
    shotCount: DATA.shots.length,
    visual: DATA.config.visual,
    envelope: DATA.config.envelope,
    beatLen: DATA.config.beatLen,
    beats: DATA.beats,
    downbeatEvery: DATA.config.downbeatEvery || 4,
    segments: DATA.segments,
    lyricLines: (DATA.config && DATA.config.lyricLines) || null,
    beatsBetween: beatsBetween,
    nextBeatAfter: nextBeatAfter,
  });
  // ④ vignette 收尾
  drawVignette();
};
</script>
</body>
</html>
